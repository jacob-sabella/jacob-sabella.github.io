# Projects shown on the home page (featured: true) and on /projects/.
# `short` is the one-liner for home cards, `summary` is the full blurb.

- title: NAM for MPC
  url: /projects/nam-mpc/
  tag: C++ · VST2 effect for Akai MPC OS
  featured: true
  short: Neural Amp Modeler running natively on MPC standalone hardware.
  summary: >-
    Neural Amp Modeler running natively on MPC standalone hardware. Amp/pedal captures plus cab IR,
    tone stack, gate, pitch, delay and reverb, a model browser, and in-plugin TONE3000 downloads.
    Runs Lite A2 captures at ~13% of one Cortex-A17 core.

- title: XMage Web Client
  url: /projects/xmage-web/
  tag: Java gateway · React + TypeScript
  featured: true
  short: A browser UI for the XMage Magic engine, with a 3D multiplayer board.
  summary: >-
    Browser UI for the XMage Magic: The Gathering engine. JVM gateway bridges JBoss Remoting to
    REST/WebSocket JSON; the React client covers the lobby, a 3D multiplayer board with UI for every
    in-game decision, and a deck editor.

